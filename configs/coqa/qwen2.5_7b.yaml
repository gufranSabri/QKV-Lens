# coqa x Qwen/Qwen2.5-7B   [QKV-Lens/HalluShift setting]
llm:
  name: Qwen/Qwen2.5-7B
  alias: qwen2.5_7b

extract:
  # GQA: D_kv=512 isn't divisible by L=28, so the default (M=L) fails.
  # 32 is the closest valid divisor of 512 -- and the paper's M.
  n_segments: 32

dataset:
  name: coqa
  n_samples: 10000
  prompt_template: "Answer the question concisely based on the context: \n {story} \n Q: {question} A:"
