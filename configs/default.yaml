# QKV-Lens defaults. Fixed-in-code settings (field layout, mean pooling,
# greedy decoding) are not keys here -- see the top of src/config.py.

llm:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  dtype: bfloat16
  alias: llama3_8b

dataset:
  name: triviaqa
  n_samples: 10000
  max_new_tokens: 64
  prompt_template: "Answer the question concisely. Q: {question} A:"

extract:
  dtype: float16
  max_tokens: 100
  batch_size: 8 # examples generated together; purely a speed knob
  n_segments: null # M. null -> use the model's layer count => SQUARE field
  l_eff: null # null -> keep the model's L. Must stay null for steering.

labeling:
  scheme: llm_judge # exact_match | bleurt | llm_judge
  bleurt_threshold: 0.5 # hallucination = 1 if max BLEURT <= 0.5
  bleurt_checkpoint: models/BLEURT-20-D12
  llm_judge_model: deepseek/deepseek-v4-pro # Novita AI model id

model:
  embed_dim: 2048 # E: backbone output per token
  conv1d_layers: 2
  lstm_hidden: 2048
  lstm_layers: 1
  dropout: 0.3
  use_proj: true # false -> flatten only (no Linear)
  use_lstm: true # false -> identity
  use_attn_pool: true # false -> masked mean over real tokens
  keep_channels: [Q, K] # null keeps all 3; [Q,K] won representation_ablation.csv
  token_buckets: null # null keeps every token
  layer_permute_seed: null # null keeps true layer order
  segment_permute_seed: null # null keeps true segment (M) order
  collapse_axis: null # M | L | channels; null collapses nothing (won collapse_axis_ablation.csv)

train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  backbone_lr_scale: 0.1
  lr_decay_start: 5
  lr_final_scale: 0.0
  epochs: 20
  patience: 8
  seed: 42
  num_workers: 4
  val_fraction: 0.25
  test_fraction: 0.25
  balance_classes: true

