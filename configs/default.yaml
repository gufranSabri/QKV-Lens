# QKV-Steer defaults. Fixed-in-code settings (field layout, mean pooling,
# greedy decoding) are not keys here -- see the top of src/config.py.

llm:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  dtype: bfloat16
  alias: llama3_8b

dataset:
  name: triviaqa
  n_samples: 10000
  max_new_tokens: 64
  prompt_template: "Answer the question concisely. Q: {question} A:"

extract:
  dtype: float16
  max_tokens: 100
  batch_size: 8 # examples generated together; purely a speed knob
  n_segments: null # M. null -> use the model's layer count => SQUARE field
  l_eff: null # null -> keep the model's L. Must stay null for steering.

labeling:
  scheme: bleurt # exact_match | bleurt
  bleurt_threshold: 0.5 # hallucination = 1 if max BLEURT <= 0.5
  bleurt_checkpoint: models/BLEURT-20-D12

model:
  backbone: layer_cnn # layer_cnn (MAIN) | flat_mlp | grid_cnn | layer_attn | layer_mha | layer_vit
  embed_dim: 2048 # E: backbone output per token
  conv1d_layers: 2
  lstm_hidden: 2048
  lstm_layers: 1
  dropout: 0.3

train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  backbone_lr_scale: 0.1
  lr_decay_start: 5
  lr_final_scale: 0.0
  epochs: 20
  patience: 8
  seed: 42
  num_workers: 4
  val_fraction: 0.25
  test_fraction: 0.25
  balance_classes: true

# Set this to a QKV-Steer-specific path -- do NOT point it at the QKV-Lens
