# QKV-Steer defaults. Fixed-in-code settings (field layout, mean pooling,
# greedy decoding) are not keys here -- see the top of src/config.py.

llm:
  name: meta-llama/Meta-Llama-3-8B-Instruct
  dtype: bfloat16
  alias: llama3_8b

dataset:
  name: triviaqa
  n_samples: 10000
  max_new_tokens: 64
  prompt_template: "Answer the question concisely. Q: {question} A:"

extract:
  dtype: float16
  max_tokens: 100
  batch_size: 8 # examples generated together; purely a speed knob
  n_segments: null # M. null -> use the model's layer count => SQUARE field
  l_eff: null # null -> keep the model's L. Must stay null for steering.

labeling:
  scheme: bleurt # exact_match | bleurt
  bleurt_threshold: 0.5 # hallucination = 1 if max BLEURT <= 0.5
  bleurt_checkpoint: models/BLEURT-20-D12

model:
  backbone: layer_grid # layer_grid (MAIN) | flat_mlp -- winner: structure_analysis.csv (gridbb > flat, permL42)
  embed_dim: 2048 # E: backbone output per token
  conv1d_layers: 2
  lstm_hidden: 2048
  lstm_layers: 1
  dropout: 0.3
  # Which of the field's 3 fixed channels (Q, K, V) reach the detector.
  # [Q, K] won representation_ablation.csv on every model tested. null
  # keeps all three; set to null to reproduce the QKV-Lens Table 4 baseline.
  keep_channels: [Q, K]
  # Compress the TOKEN axis to this many buckets by mean-pooling contiguous
  # runs, applied after extract.max_tokens cropping. null (default) keeps
  # every token -- see scripts/experiments/token_compression_ablation.sh.
  token_buckets: null
  # Structure-preservation control: permute the LAYER axis with a fixed
  # seeded permutation, applied to every example. null (default) keeps true
  # order -- only used by structure_analysis.sh's permL42 arm.
  layer_permute_seed: null
  # Feature-pooling ablation: collapse one field axis (M, L, or channels) to
  # size 1 by averaging. null (default) collapses nothing -- the full field
  # won collapse_axis_ablation.csv by 1.5-5.5 AUROC points over every
  # collapsed arm. Mutually exclusive with layer_permute_seed.
  collapse_axis: null
  # LayerGrid component truth table: full (all 3 "on") won
  # layer_grid_component_ablation.csv. use_gate only matters when
  # use_conv=true -- it modulates the conv branch.
  layer_grid_use_gate: true
  layer_grid_use_conv: true
  layer_grid_use_skip: true

train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  backbone_lr_scale: 0.1
  lr_decay_start: 5
  lr_final_scale: 0.0
  epochs: 20
  patience: 8
  seed: 42
  num_workers: 4
  val_fraction: 0.25
  test_fraction: 0.25
  balance_classes: true

# Set this to a QKV-Steer-specific path -- do NOT point it at the QKV-Lens
# corpus: the on-disk field layout changed to (T, L, M, 3).
# data_root: /home/ahmedubc/scratch/QKV-Steer-data
# runs_root: /home/ahmedubc/projects/aip-lsigal/ahmedubc/QKV-Steer

data_root: /scratch/ahmedubc/QKV-Steer-data
runs_root: /home/ahmedubc/projects/aip-lsigal/ahmedubc/QKV-Steer/runs